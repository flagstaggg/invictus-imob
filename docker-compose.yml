services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-invictus}
      POSTGRES_USER: ${POSTGRES_USER:-invictus_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-invictus_app} -d ${POSTGRES_DB:-invictus}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # sem portas publicadas: o banco só é acessível pela rede interna do Docker

  app:
    build: .
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./uploads:/app/server/uploads
    expose:
      - "3333"
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - app

volumes:
  pgdata: