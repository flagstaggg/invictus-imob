server {
  listen 80;
  server_name SEU_DOMINIO.com.br www.SEU_DOMINIO.com.br;

  # validação do Let's Encrypt
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    proxy_pass http://app:3333;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 25m; # uploads de fotos
  }

  # após obter o certificado, substitua este bloco por HTTPS (ver DEPLOY.md)
}
